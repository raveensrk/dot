[package]
name = "sync2"
version = "0.1.0"
edition = "2024"
description = "Sync many git repositories in parallel; Rust rewrite of ,sync.py"
publish = false

[[bin]]
name = "sync2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
gix = { version = "0.89", default-features = false, features = ["sha1", "status", "revision", "max-performance-safe"] }
globset = "0.4"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
shellexpand = "3"
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
