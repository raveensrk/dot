# Keywords matched as "- KEYWORD: content" or after a source comment prefix.
# FIXME and BUG are tags (+fixme, +bug), not keywords - see the todo schema.
patterns = ["TODO", "IN_PROGRESS", "LATER"]

# Keywords whose items are hidden by default (they are still matched; show them
# with --include-excluded). Compared against the line's leading status token, so
# "- TODO: ... revisit LATER" is still reported. An empty array hides nothing.
exclude_patterns = ["LATER"]

# Patterns matched as "- [ ] content" in Markdown files. Empty on purpose: the
# todo schema treats checkboxes as checklists, not todo items. Deleting the key
# does not turn them off - the scanner then falls back to ['\[ \]'].
checkbox_patterns = []

# Lifecycle states from ~/repos/ai/docs/agents/todo_schema.org, in cycle order. Unlike `patterns`
# (what the scanner reports) this is the full vocabulary, terminal states
# included. Used by vim's :TodoState cycle and by `,todo.py --states`.
states = ["TODO", "IN_PROGRESS", "OPTIONAL", "LATER", "DONE", "OBSOLETE"]

# Markdown file extensions.
extensions = ["md"]

# Source extensions scanned only when --all-extensions is present.
# An empty array disables source scanning.
source_extensions = ["py", "sh", "bash", "sv", "svh", "v", "vim"]

# Comment prefixes accepted in non-Markdown files (ripgrep regex).
comment_prefix_pattern = '//+|#|--|;|/\*+|\*+|<!--|%'

# Paths scanned when no positional paths are supplied.
default_dirs = ["~/dot", "~/repos"]

# Additional ignores applied alongside ripgrep's normal ignore behavior.
# Keep only generic, non-sensitive entries here. Computer-specific
# paths belong in the machine-local overlay ~/dot_local/config/todo.toml, whose
# `ignore` array is appended to this one.
ignore = ["node_modules"]

# A todo that @mentions anyone in this list is dropped (case-insensitive).
# Every other @tag, such as the context tag @writing, is kept. Real names
# belong in the machine-local overlay ~/dot_local/config/todo.toml.
others = []

# Kanban flow order: results are sorted by status in this order (file:line breaks
# ties within a status). "[ ]" is the checkbox token; anything not listed sorts
# last. An empty array falls back to plain file-path ordering.
flow_order = ["IN_PROGRESS", "TODO", "LATER"]
